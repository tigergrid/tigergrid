name: CI

on:
  push:
    branches: ['**']
    # A v* tag runs everything below and then publishes the release (path filters don't
    # apply to tag pushes).
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: ['**']
    paths-ignore:
      - '**/*.md'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The binaries print package.json's version, so a release tag has to name the same one.
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      # test/network.test.ts traces the CLI with strace to prove it makes no connections.
      - name: Install strace
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends strace

      # The same chain as the husky pre-commit hook (`bun run precommit`).
      - name: Format check
        run: bun run format:check

      - name: Type-check
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  # The npm package (the parsers) as a consumer gets it, on the oldest and the newest
  # supported Node.js. The CLI and the TUI ship as the binaries below.
  node:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.17.0', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run test:lib

  # Each target is built and smoke-tested on matching hardware (scripts/smoke.ts); the
  # binaries are attached to the run as artifacts.
  binaries:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
          - runner: macos-latest
            target: bun-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same checks as `bun run smoke` locally: build, then --version, --json, terminal output
      # and an SVG in each cell style, all against the fixtures.
      - name: Build and smoke-test
        run: bun scripts/smoke.ts ${{ matrix.target }}

      # `tigergrid -i` from the binary just built, driven on a real pseudo-terminal: keys,
      # commands, exports, paste, resize, and the terminal restored on every way out.
      - name: TUI on a real pseudo-terminal
        run: |
          target='${{ matrix.target }}'
          TIGERGRID_TUI_BINARY="dist/tigergrid-${target#bun-}" bun test test/tui.test.ts

      - uses: actions/upload-artifact@v4
        with:
          name: tigergrid-${{ matrix.target }}
          path: dist/

  # On a v* tag, once every job above has passed: the binaries just built and tested become
  # a GitHub Release, so releases/latest/download/tigergrid-<os>-<arch> always fetches the
  # newest one.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [node, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tigergrid-bun-*
          path: artifacts

      # Each runner hashed its own binary; check every hash, then combine them.
      - name: Collect the binaries and SHA256SUMS
        run: |
          mkdir release
          for dir in artifacts/*/; do
            (cd "$dir" && sha256sum -c SHA256SUMS)
            cat "$dir/SHA256SUMS" >> release/SHA256SUMS
            mv "$dir"tigergrid-* release/
          done
          ls -l release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
